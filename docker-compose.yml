services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hotel_management
      POSTGRES_USER: hotel_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_env}
    volumes:
      - hotelmanagementsystem-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_app -d hotel_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  hotelmanagementsystem.web:
    image: ${DOCKER_REGISTRY-}hotelmanagementsystemweb
    build:
      context: .
      dockerfile: HotelManagementSystem.Web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=hotel_management;Username=hotel_app;Password=${DB_PASSWORD:-changeme_in_env}"
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-admin@hotel.local}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:-changeme_in_env}
      SeedAdmin__FullName: ${SEED_ADMIN_FULLNAME:-Адміністратор}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  hotelmanagementsystem-postgres-data: